services:
  chatops-backend:
    image: node:20-bullseye
    container_name: chatops-backend
    working_dir: /workspace/Chatops/backend
    volumes:
      - ./Chatops/backend:/workspace/Chatops/backend
      - /workspace/Chatops/backend/node_modules
    environment:
      PORT: 3002
      WS_PORT: 9001
      CORS_ORIGIN: http://localhost:5173,http://localhost:3006
      DATABASE_URL: postgresql://chatops:chatops@postgres_chatops:5432/chatops_db
      REDIS_URL: redis://redis:6379
      LOGISTICS_URL: http://logistica-backend:3000
    ports:
      - "3002:3002"
      - "9001:9001"
    depends_on:
      postgres_chatops:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "apt-get update && apt-get install -y libssl1.1 --no-install-recommends && npm install && npx prisma generate && npm run build && npm start"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', res => process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  chatops-frontend:
    image: node:20-bullseye
    container_name: chatops-frontend
    working_dir: /workspace/Chatops/frontend
    volumes:
      - ./Chatops/frontend:/workspace/Chatops/frontend
      - /workspace/Chatops/frontend/node_modules
    environment:
      VITE_WS_URL: ws://localhost:9001
      VITE_API_URL: http://localhost:3002
      HOST: 0.0.0.0
      PORT: 5173
      BROWSER: none
    ports:
      - "3006:5173"
    depends_on:
      - chatops-backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

  logistica-backend:
    build:
      context: ./logistica-multi-tenant-clean
      dockerfile: backend-nest/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_logistica:5432/logistica
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PORT: 3000
      NODE_ENV: development
    depends_on:
      postgres_logistica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', res => process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  logistica-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./infra/nginx/logistica.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      logistica-backend:
        condition: service_healthy
    networks:
      - default

  logistica-frontend:
    image: node:20-bullseye
    container_name: logistica-frontend
    working_dir: /workspace/logistica-multi-tenant-clean/frontend
    volumes:
      - ./logistica-multi-tenant-clean/frontend:/workspace/logistica-multi-tenant-clean/frontend
      - /workspace/logistica-multi-tenant-clean/frontend/node_modules
    environment:
      DOCKER_BACKEND_URL: http://logistica-backend:3000
      HOST: 0.0.0.0
      PORT: 3000
      BROWSER: none
    ports:
      - "3001:3000"
    depends_on:
      - logistica-backend
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped
