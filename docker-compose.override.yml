services:
  chatops-backend:
    build:
      context: ./Chatops/backend
      dockerfile: Dockerfile
    image: chatops-backend:dev
    container_name: chatops-backend
    working_dir: /app
    volumes:
      - ./Chatops/backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3002
      WS_PORT: 9001
      CORS_ORIGIN: http://localhost:5173,http://localhost:3006,http://localhost:5177,http://127.0.0.1:5177
      DATABASE_URL: postgresql://${POSTGRES_CHATOPS_USER:-chatops}:${POSTGRES_CHATOPS_PASSWORD:-chatops}@postgres_chatops:5432/${POSTGRES_CHATOPS_DB:-chatops_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-secure-random-secret}
      COMMERCE_API_URL: http://backend:3001/api/v1
      LOGISTICS_URL: http://logistica-backend:3000
      LOGISTICS_API_KEY: ${LOGISTICS_API_KEY:-}
      TURN_URLS: ${CHATOPS_TURN_URLS:-}
      TURN_SHARED_SECRET: ${CHATOPS_TURN_SHARED_SECRET:-}
    ports:
      - "3002:3002"
      - "9001:9001"
    depends_on:
      postgres_chatops:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm ci && npx prisma generate && npm run build && npm start"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', res => process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  chatops-frontend:
    image: node:20-bullseye
    container_name: chatops-frontend
    working_dir: /workspace/Chatops/frontend
    volumes:
      - ./Chatops/frontend:/workspace/Chatops/frontend
      - /workspace/Chatops/frontend/node_modules
    environment:
      DOCKER_BACKEND_URL: http://chatops-backend:3002
      DOCKER_WS_URL: ws://chatops-backend:9001
      HOST: 0.0.0.0
      PORT: 5173
      BROWSER: none
    ports:
      - "3006:5173"
    depends_on:
      - chatops-backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

  logistica-backend:
    build:
      context: ./logistica-multi-tenant-clean
      dockerfile: backend-nest/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_LOGISTICA_USER:-postgres}:${POSTGRES_LOGISTICA_PASSWORD:-postgres}@postgres_logistica:5432/${POSTGRES_LOGISTICA_DB:-logistica}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-logistica-jwt-secret}
      CORS_ORIGIN: http://localhost:3003
      PORT: 3000
      NODE_ENV: development
    depends_on:
      postgres_logistica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', res => process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  logistica-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./infra/nginx/logistica.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      logistica-backend:
        condition: service_healthy
    networks:
      - default

  logistica-frontend:
    image: node:20-bullseye
    container_name: logistica-frontend
    working_dir: /workspace/logistica-multi-tenant-clean/frontend
    volumes:
      - ./logistica-multi-tenant-clean/frontend:/workspace/logistica-multi-tenant-clean/frontend
      - /workspace/logistica-multi-tenant-clean/frontend/node_modules
    environment:
      DOCKER_BACKEND_URL: http://logistica-backend:3000
      HOST: 0.0.0.0
      PORT: 3000
      WDS_SOCKET_PORT: 3003
      BROWSER: none
    ports:
      - "3003:3000"
    depends_on:
      - logistica-backend
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped
