name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
permissions:
  contents: read
  security-events: write

jobs:
  # ============ BACKEND TESTS ============
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Tranzor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (Backend)
        working-directory: backend
        run: npm ci

      - name: Setup database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Tranzor_test
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run unit tests
        working-directory: backend
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
          fail_ci_if_error: false

  # ============ FRONTEND TESTS ============
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check build output
        working-directory: frontend
        run: ls -la dist/

  # ============ E2E TESTS ============
  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Tranzor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\" || mongo --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        working-directory: backend
        run: npm ci

      - name: Setup database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Tranzor_test
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install --with-deps

      - name: Generate ephemeral E2E admin password
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'ADMIN_PASSWORD=' + require('node:crypto').randomBytes(32).toString('base64url') + '\n')"

      - name: Run E2E tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Tranzor_test
          MONGODB_URI: mongodb://localhost:27017/tranzor_test
          REDIS_URL: redis://localhost:6379
          AUTH_RATE_LIMIT_MAX_REQUESTS: 1000
          RATE_LIMIT_MAX_REQUESTS: 1000
        run: npm run test:e2e
        timeout-minutes: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/playwright-report/
          retention-days: 30

  # Nightly / Manual job to run full browser matrix (firefox, webkit, mobile)
  e2e-nightly:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        working-directory: backend
        run: npm ci

      - name: Setup database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Tranzor_test
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install --with-deps

      - name: Run Full E2E tests (manual/nightly)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Tranzor_test
          MONGODB_URI: mongodb://localhost:27017/tranzor_test
          PLAYWRIGHT_FULL: 'true'
        run: npm run test:e2e
        timeout-minutes: 60

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: backend/playwright-report/
          retention-days: 30

  # ============ CODE QUALITY ============
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        working-directory: backend
        run: npm ci

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        with:
          projectKey: ${{ env.SONAR_PROJECT_KEY }}
          organization: ${{ env.SONAR_ORGANIZATION }}

  # ============ SECURITY ============
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        # Skip SARIF upload for forked PRs because the integration token
        # (GITHUB_TOKEN) doesn't have permission to write security alerts on forks.
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ============ DEPLOY TO STAGING ============
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, code-quality]

    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Validate staging configuration
        run: |
          bash scripts/validate-staging.sh

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          bash scripts/deploy-staging.sh

      - name: Rollback on failure
        if: failure()
        run: |
          bash scripts/rollback-staging.sh
