name: Logistics CI

on:
  push:
    paths:
      - 'logistica-multi-tenant-clean/backend-nest/**'
      - 'logistica-multi-tenant-clean/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/logistica-backend.yml'
  pull_request:
    paths:
      - 'logistica-multi-tenant-clean/backend-nest/**'
      - 'logistica-multi-tenant-clean/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/logistica-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-logistica-test
          POSTGRES_DB: logistica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d logistica_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-logistica-test@localhost:5432/logistica_test?schema=public
      JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-logistica-ci-ephemeral-jwt-secret
      NODE_ENV: test
    defaults:
      run:
        working-directory: logistica-multi-tenant-clean/backend-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logistica-multi-tenant-clean/backend-nest/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm test -- --runInBand
      - run: npm run build

  backend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-logistica-e2e
          POSTGRES_DB: logistica_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d logistica_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-logistica-e2e@localhost:5432/logistica_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-logistica-e2e-ephemeral-jwt-secret
      NODE_ENV: test
    defaults:
      run:
        working-directory: logistica-multi-tenant-clean/backend-nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logistica-multi-tenant-clean/backend-nest/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - run: npm run test:e2e -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-multi-tenant-clean/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: logistica-multi-tenant-clean/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
        env:
          CI: true
      - run: npm run build
