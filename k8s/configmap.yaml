apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  NODE_ENV: production
  MONGO_INITDB_DATABASE: Tranzor
  POSTGRES_TRANZOR_DB: tranzor
  POSTGRES_TRANZOR_USER: tranzor_app
  POSTGRES_CHATOPS_DB: chatops_db
  POSTGRES_CHATOPS_USER: chatops
  POSTGRES_LOGISTICA_DB: logistica
  POSTGRES_LOGISTICA_USER: postgres
  CLICKHOUSE_DB: Tranzor
  CLICKHOUSE_USER: default
  TRANZOR_PORT: "3001"
  CHATOPS_HTTP_PORT: "3002"
  CHATOPS_WS_PORT: "9001"
  LOGISTICA_PORT: "3000"
  TRANZOR_FRONTEND_URL: http://tranzor.local
  TRANZOR_CORS_ORIGIN: http://tranzor.local
  CHATOPS_NODE_ENV: development
  CHATOPS_CORS_ORIGIN: http://chatops.local,http://localhost:3006,http://127.0.0.1:3006
  APP_SHUTDOWN_TIMEOUT_MS: "10000"
