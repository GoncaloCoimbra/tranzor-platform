apiVersion: apps/v1
kind: Deployment
metadata:
  name: tranzor-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tranzor-backend
  template:
    metadata:
      labels:
        app: tranzor-backend
    spec:
      containers:
        - name: backend
          image: tranzor-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TRANZOR_PORT
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TRANZOR_FRONTEND_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TRANZOR_CORS_ORIGIN
            - name: APP_SHUTDOWN_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_SHUTDOWN_TIMEOUT_MS
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: deployment-secrets
                  key: TRANZOR_MONGODB_URI
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deployment-secrets
                  key: TRANZOR_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deployment-secrets
                  key: TRANZOR_JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: deployment-secrets
                  key: TRANZOR_JWT_REFRESH_SECRET
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CLICKHOUSE_HTTP_URL
              value: http://clickhouse:8123
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deployment-secrets
                  key: CLICKHOUSE_PASSWORD
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tranzor-backend
spec:
  selector:
    app: tranzor-backend
  ports:
    - name: http
      port: 3001
      targetPort: http
  type: ClusterIP
