services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: Tranzor-backend:prod
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_SHUTDOWN_TIMEOUT_MS: 10000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tranzor_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatória}@postgres:5432/${POSTGRES_DB:-tranzor}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}@redis:6379
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY é obrigatória}
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD é obrigatória}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatória}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET é obrigatória}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      clickhouse:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs

  mongo:
    image: public.ecr.aws/docker/library/mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: Tranzor
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME é obrigatória}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD é obrigatória}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: public.ecr.aws/docker/library/postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tranzor}
      POSTGRES_USER: ${POSTGRES_USER:-tranzor_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatória}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatória}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    restart: always
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:?TYPESENSE_API_KEY é obrigatória}"]
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-Tranzor}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD é obrigatória}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  backend_data:
  backend_logs:
  mongo_data:
  postgres_data:
  redis_data:
  typesense_data:
  clickhouse_data:
