services:
  db:
    image: postgres:15-alpine
    container_name: logistica-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-logistica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logistica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: logistica-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - logistica-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend-nest/Dockerfile
    container_name: logistica-backend
    volumes:
      - uploads:/app/backend-nest/uploads
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-logistica}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      ALLOW_DEGRADED: ${ALLOW_DEGRADED:-false}
      STARTUP_MAX_ATTEMPTS: ${STARTUP_MAX_ATTEMPTS:-5}
      STARTUP_RETRY_DELAY_MS: ${STARTUP_RETRY_DELAY_MS:-250}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PORT: 3000
      NODE_ENV: development
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","node -e \"require('http').get('http://localhost:3000/health', res => process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logistica-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: logistica-frontend
    environment:
      - WDS_SOCKET_PORT=3001
      - DOCKER_BACKEND_URL=http://logistica-backend:3000
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - logistica-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  logistica-network:
    driver: bridge
