services:
  db:
    image: postgres:15-alpine
    container_name: logistica-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logistica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: logistica-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logistica-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend-nest/Dockerfile
    container_name: logistica-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/logistica
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-with-a-secure-random-secret
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","node -e \"require('http').get('http://localhost:3000/health', res => process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logistica-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: logistica-frontend
    environment:
      - WDS_SOCKET_PORT=3001
      - DOCKER_BACKEND_URL=http://logistica-backend:3000
    ports:
      - "3001:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - logistica-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:

networks:
  logistica-network:
    driver: bridge